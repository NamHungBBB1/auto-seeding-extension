<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>FB Auto Seeding</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="container">
        <div class="card shadow-lg rounded-4 p-4 mx-auto" style="max-width: 450px;">
            <h2 class="text-center mb-4 text-primary fw-bold">FB Auto Seeding</h2>

            <div class="d-flex justify-content-center gap-3 mb-3">
                <a href="https://www.facebook.com/AnnHome.VN" target="_blank" class="btn btn-outline-primary">
                    AnnHome.VN
                </a>
                <a href="https://www.facebook.com/annhome.careers" target="_blank" class="btn btn-outline-success">
                    AnnHome Careers
                </a>
            </div>

            <div class="mb-3">
                <label for="apiKey" class="form-label">API Key Gemini:</label>
                <input type="text" id="apiKey" class="form-control" placeholder="Nhập API Key">
            </div>

            <div class="d-flex justify-content-center gap-3">
                <button id="startBtn" class="btn btn-success px-4">Start</button>
                <button id="stopBtn" class="btn btn-danger px-4">Stop</button>
            </div>

            <div id="log" class="mt-4 p-3 border rounded bg-white" style="min-height: 100px; font-size: 14px;">
                <em>Logs sẽ hiển thị ở đây...</em>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="popup.js"></script>
</body>

</html>
